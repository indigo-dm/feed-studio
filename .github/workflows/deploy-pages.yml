name: Deploy Feed Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [feed-data-updated]
  schedule:
    - cron: "47 0,13 * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir site
          cp index.html app.css app.js access.js access-config.js runtime-config.js robots.txt .nojekyll site/
          cp -R assets site/assets
          mkdir -p site/feeds
          curl --fail --silent --show-error --retry 3 \
            https://feed-api.indigo-dm.ru/data/projects.json \
            --output /tmp/feed-projects.json
          node -e "const p=require('/tmp/feed-projects.json'); for(const item of p.projects||[]) if(item.available) console.log(item.slug)" > /tmp/feed-project-slugs
          while IFS= read -r slug; do
            mkdir -p "site/feeds/$slug"
            curl --fail --silent --show-error --retry 3 \
              "https://feed-api.indigo-dm.ru/data/projects/${slug}/avito.xml" \
              --output "site/feeds/$slug/avito.xml"
          done < /tmp/feed-project-slugs
          test -f site/feeds/novyy-gorizont/avito.xml

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
