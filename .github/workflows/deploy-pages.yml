name: Deploy Feed Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [feed-data-updated]
  schedule:
    - cron: "47 0,13 * * *"
      timezone: "Europe/Moscow"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir site
          cp index.html app.css app.js access.js access-config.js runtime-config.js robots.txt .nojekyll site/
          cp -R assets site/assets
          mkdir -p site/feeds
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 15 --max-time 60 --retry-max-time 180 \
            https://feed-api.indigo-dm.ru/data/projects.json \
            --output /tmp/feed-projects.json
          node -e "const p=require('/tmp/feed-projects.json'); for(const item of p.projects||[]) if(item.available) console.log(item.slug)" > /tmp/feed-project-slugs
          while IFS= read -r slug; do
            mkdir -p "site/feeds/$slug"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              --connect-timeout 15 --max-time 60 --retry-max-time 180 \
              "https://feed-api.indigo-dm.ru/data/projects/${slug}/avito.xml" \
              --output "site/feeds/$slug/avito.xml"
          done < /tmp/feed-project-slugs
          test -f site/feeds/novyy-gorizont/avito.xml

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v8
        with:
          script: |
            const waitForArtifact = require('./.github/scripts/wait-pages-artifact.cjs');
            await waitForArtifact({
              list: async () => (await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              })).data.artifacts,
              log: core.info
            });

      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Allow artifact service to settle
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 20

      - name: Retry Pages deployment
        id: deployment_retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final deployment attempt
        if: ${{ !cancelled() && steps.deployment_retry.outcome == 'failure' }}
        run: sleep 40

      - name: Final Pages deployment attempt
        id: deployment_final
        if: ${{ !cancelled() && steps.deployment_retry.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
